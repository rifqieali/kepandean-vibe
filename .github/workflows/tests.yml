name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Build SSR bundle
        run: npm run build:ssr

      - name: Start SSR server
        run: |
          php artisan inertia:start-ssr > /tmp/ssr.log 2>&1 &
          SSR_PID=$!
          echo "SSR_PID=$SSR_PID" >> $GITHUB_ENV
          sleep 5
          # Probe memakai payload minimal yang realistis (bukan props kosong):
          # di production Inertia selalu mengirim props lengkap dari backend,
          # jadi render dengan {} tidak pernah terjadi dan hanya menutupi
          # kesiapan SSR yang sebenarnya.
          curl -sf http://127.0.0.1:13714/render -X POST -H 'Content-Type: application/json' -d '{"component":"welcome","props":{"site":{"nama":"Desa Kepandean","nav":[],"footer":{"layanan":[],"cepat":[]},"kontak":{"telepon":"-","surel":"probe@example.com","jam":[],"sosmed":[]}},"meta":{"title":"Probe SSR","description":"Probe SSR"},"profilExcerpt":{"sejarah":null,"urls":{"sejarah":"/","visiMisi":"/"}},"beritaTerkini":[],"heroSlides":[],"statistik":{"total_jiwa":"0","laki_laki":"0","perempuan":"0","kepala_keluarga":"0"},"lokasi":{"kode_pos":"","koordinat":"","latitude":0,"longitude":0,"alamat":"","peta_url":"https://example.com","peta_embed":"","surel":""}},"url":"/","version":"1"}' > /dev/null || (cat /tmp/ssr.log; exit 1)

      - name: Run CI Checks
        run: composer ci:check
