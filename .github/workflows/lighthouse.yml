name: lighthouse

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Build SSR bundle
        run: npm run build:ssr

      - name: Start SSR server
        run: |
          php artisan inertia:start-ssr > /tmp/ssr.log 2>&1 &
          echo "SSR_PID=$!" >> $GITHUB_ENV
          sleep 5
          # Payload minimal yang realistis, sama seperti workflow tests.
          curl -sf http://127.0.0.1:13714/render -X POST -H 'Content-Type: application/json' -d '{"component":"welcome","props":{"site":{"nama":"Desa Kepandean","nav":[],"footer":{"layanan":[],"cepat":[]},"kontak":{"telepon":"-","surel":"probe@example.com","jam":[],"sosmed":[]}},"meta":{"title":"Probe SSR","description":"Probe SSR"},"profilExcerpt":{"sejarah":null,"urls":{"sejarah":"/","visiMisi":"/"}},"beritaTerkini":[],"heroSlides":[],"statistik":{"total_jiwa":"0","laki_laki":"0","perempuan":"0","kepala_keluarga":"0"},"lokasi":{"kode_pos":"","koordinat":"","latitude":0,"longitude":0,"alamat":"","peta_url":"https://example.com","peta_embed":"","surel":""}},"url":"/","version":"1"}' > /dev/null || (cat /tmp/ssr.log; exit 1)

      - name: Optimize for production parity
        run: |
          composer dump-autoload --optimize
          APP_DEBUG=false php artisan config:cache
          php artisan view:cache

      - name: Start application server
        run: |
          APP_DEBUG=false php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          echo "SERVE_PID=$!" >> $GITHUB_ENV
          sleep 5
          curl -sf http://127.0.0.1:8000/ > /dev/null || (cat /tmp/serve.log; exit 1)
          # Pemanasan: halaman pertama menanggung boot dingin (opcache, SSR),
          # jadi sentuh ketiga URL dulu agar gate mengukur kondisi hangat
          # seperti production yang sudah berjalan.
          curl -sf http://127.0.0.1:8000/berita > /dev/null
          curl -sf http://127.0.0.1:8000/profil/sejarah-visi-misi > /dev/null
          curl -sf http://127.0.0.1:8000/ > /dev/null

      - name: Run Lighthouse mobile gate (Beranda, Berita, Profil)
        # Catatan ambang: skor performance absolut (target >=85) diukur di
        # PageSpeed Insights production (langkah manual issue #20), karena
        # angkanya didominasi noise runner CI (kode yang sama pernah
        # terbaca 43 dan 69). Gate merge di sini menegaskan metrik yang
        # deterministik di CI: TTFB server (menangkap regresi N+1), CLS
        # (stabilitas layout), dan nol error konsol. Skor absolut tetap
        # dicetak sebagai arsip tiap merge.
        run: |
          urls="http://127.0.0.1:8000/ http://127.0.0.1:8000/berita http://127.0.0.1:8000/profil/sejarah-visi-misi"
          i=0
          for url in $urls; do
            i=$((i + 1))
            out="/tmp/lh-$i.json"
            npx -y lighthouse@12 "$url" \
              --form-factor=mobile \
              --throttling-method=simulate \
              --output=json \
              --output-path="$out" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              const perf = report.categories.performance.score * 100;
              const lcp = report.audits['largest-contentful-paint'].numericValue;
              const cls = report.audits['cumulative-layout-shift'].numericValue;
              const ttfb = report.audits['server-response-time'].numericValue;
              const consoleErrors = (report.audits['errors-in-console']?.details?.items ?? []).length;
              console.log(process.argv[2]);
              console.log('  info: performance ' + perf.toFixed(0) + ', LCP ' + Math.round(lcp) + 'ms, CLS ' + cls.toFixed(3));
              console.log('  gate: server-response-time ' + Math.round(ttfb) + 'ms, console errors ' + consoleErrors);
              const failures = [];
              if (ttfb >= 1000) failures.push('server-response-time ' + Math.round(ttfb) + 'ms >= 1000ms');
              if (cls >= 0.1) failures.push('CLS ' + cls.toFixed(3) + ' >= 0.1');
              if (consoleErrors > 0) failures.push(consoleErrors + ' console error(s)');
              if (failures.length > 0) { console.error('LIGHTHOUSE GATE FAIL: ' + failures.join(', ')); process.exit(1); }
            " "$out" "$url"
          done
